# Render Blueprint for the backend. Optional -- you can also create a Web
# Service manually in the Render dashboard (see README's Deployment
# section) and skip this file entirely; both end up in the same place.
#
# To use it: Render dashboard -> New -> Blueprint -> point at this repo.
# Render will read this file and propose the service below. Any env var
# marked `sync: false` needs its value filled in by hand in the dashboard
# (Render won't read secrets out of this file).
services:
  - type: web
    name: collab-ai-backend
    runtime: python
    # Free instances sleep after ~15 min without traffic, and waking up
    # means booting Python AND loading the embedding model (can take 30-60s
    # or more). For consistently fast replies, switch to a paid plan
    # (e.g. `starter`), which stays running.
    plan: free
    # Put the backend in the region CLOSEST TO YOUR SUPABASE PROJECT: every
    # chat message makes several database round trips, and cross-region
    # trips add ~150-250 ms each. Supabase shows its region under
    # Project Settings -> General. Examples:
    #   Supabase ap-south-1 (Mumbai) or ap-southeast-1 (Singapore) -> singapore
    #   Supabase eu-central-1 (Frankfurt)                          -> frankfurt
    #   Supabase us-east-1 (N. Virginia)                           -> virginia
    #   Supabase us-west-1 / us-west-2                             -> oregon
    # Render cannot move an existing service to a new region; changing this
    # means creating a new service.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      # Required by main.py at startup (it was missing from this file).
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Small, fast model for background jobs (memory extraction). Confirm
      # it's still served: GET https://api.groq.com/openai/v1/models
      - key: GROQ_FAST_MODEL
        value: llama-3.1-8b-instant
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: ROOM_MESSAGE_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: UPLOAD_RATE_LIMIT_PER_MINUTE
        value: "10"
